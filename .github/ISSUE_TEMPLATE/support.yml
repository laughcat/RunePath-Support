name: RunePath support request
description: Report a gameplay, display, localization, or accessibility issue.
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RunePath. Please do not include personal or sensitive information.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Other Apple device
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: iPhone 17 Pro
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS or iPadOS version
      placeholder: iOS 26.0
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - 简体中文
        - 繁體中文
        - 日本語
        - 한국어
        - Español
        - Português (Brasil)
        - Deutsch
        - Français
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain what you did and what happened.
      placeholder: |
        1. Start a new journey
        2. Connect...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots are welcome if they contain no private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included personal or sensitive information.
          required: true
